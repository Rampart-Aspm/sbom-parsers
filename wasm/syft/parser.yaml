apiVersion: rampart.aspm.dev/v1alpha1
kind: ClusterSBOMParser
metadata:
  name: syft
spec:
  format: syft
  runtime: wasm
  version: "1.0.0"
  description: "Anchore Syft SBOM parser with artifact catalog and dependency relationships"
  detect:
    filenames:
      - "*syft*.json"
    probes:
      - jsonHasKeys:
          - artifacts
          - source
  source:
    oci: ghcr.io/rampart-aspm/sbom-parsers/syft:latest
  limits:
    maxMemoryMB: 256
    timeoutSeconds: 60
